<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Coach & Strava Performance</title>

  <!-- iOS PWA podpora -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trénink">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2972/2972185.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .card { background: #131d31; border: 1px solid #1e293b; }
    .gemini-gradient { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%); }
    .gemini-border { border-color: rgba(139, 92, 246, 0.4); }
  </style>
</head>
<body class="p-3 md:p-6 max-w-6xl mx-auto pb-16">

  <!-- Horní lišta -->
  <header class="flex flex-col md:flex-row md:items-center justify-between pb-5 border-b border-slate-800 gap-4">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl gemini-gradient flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i class="fa-solid fa-sparkles text-lg"></i>
      </div>
      <div>
        <h1 class="text-xl md:text-2xl font-black flex items-center gap-2">
          <span>Gemini Coach</span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-950 text-indigo-300 border border-indigo-700">v3.5 Live</span>
        </h1>
        <p class="text-slate-400 text-xs">Živá synchronizace Strava & Banister model zátěže</p>
      </div>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <button onclick="otevritStravaModal()" id="strava-btn" class="bg-[#fc4c02] hover:bg-[#e34402] text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-2 shadow transition">
        <i class="fa-brands fa-strava text-sm"></i> <span id="strava-btn-text">Strava Připojit / Sync</span>
      </button>
      <button onclick="exportProGemini('komplexni')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-2 shadow transition">
        <i class="fa-solid fa-robot text-sm"></i> Rozebrat s Gemini
      </button>
      <button onclick="pridatAktivituModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-plus text-xs"></i> Záznam
      </button>
    </div>
  </header>

  <!-- Stav synchronizace banner (pokud běží) -->
  <div id="sync-status-banner" class="hidden mt-4 p-3 rounded-lg bg-orange-950/40 border border-orange-700/50 text-xs text-orange-300 flex items-center justify-between">
    <span id="sync-status-text"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Stahuji data ze Stravy...</span>
  </div>

  <!-- Hlavní metriky zátěže -->
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-5">
    <div class="card p-4 rounded-xl shadow-sm">
      <div class="text-[10px] md:text-xs uppercase tracking-wider text-slate-400 font-bold">Kondice (CTL)</div>
      <div class="text-2xl md:text-3xl font-black mt-1 text-cyan-400" id="ctl-val">0</div>
      <div class="text-[11px] text-slate-400 mt-1">Dlouhodobý objem (42 dní)</div>
    </div>
    <div class="card p-4 rounded-xl shadow-sm">
      <div class="text-[10px] md:text-xs uppercase tracking-wider text-slate-400 font-bold">Únava (ATL)</div>
      <div class="text-2xl md:text-3xl font-black mt-1 text-rose-400" id="atl-val">0</div>
      <div class="text-[11px] text-slate-400 mt-1">Akutní vyčerpání (7 dní)</div>
    </div>
    <div class="card p-4 rounded-xl shadow-sm">
      <div class="text-[10px] md:text-xs uppercase tracking-wider text-slate-400 font-bold">Forma / Čerstvost (TSB)</div>
      <div class="text-2xl md:text-3xl font-black mt-1 font-mono" id="tsb-val">0</div>
      <div class="text-[11px] font-semibold mt-1 truncate" id
